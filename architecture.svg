<text font-size="28" fill="#1e1e1e" text-anchor="start" dominant-baseline="middle"><tspan x="0.0" y="-73.2">spark_connect.ipynb: one notebook, three engines</tspan></text>
<text font-size="16" fill="#495057" text-anchor="start" dominant-baseline="middle"><tspan x="0.0" y="-35.4">Set NB_ENDPOINT, Run All: the same 41 pure-Spark checks run on each. Results land in findings/local/&lt;endpoint&gt;.csv</tspan></text>
<text font-size="18" fill="#1e1e1e" text-anchor="start" dominant-baseline="middle"><tspan x="0.0" y="22.8">Laptop: Jupyter kernel .venv-snowflake (PySpark 3.5.6 client), az login</tspan></text>
<text font-size="16" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle"><tspan x="127.5" y="300.0">spark_connect.ipynb</tspan><tspan x="127.5" y="320.0"></tspan><tspan x="127.5" y="340.0">Connect cell picks</tspan><tspan x="127.5" y="360.0">ENDPOINT:</tspan><tspan x="127.5" y="380.0">sail | snowflake | fabric</tspan><tspan x="127.5" y="400.0"></tspan><tspan x="127.5" y="420.0">then 41 checks:</tspan><tspan x="127.5" y="440.0">catalog, DataFrame,</tspan><tspan x="127.5" y="460.0">SQL, UDFs,</tspan><tspan x="127.5" y="480.0">Iceberg / Delta writes</tspan></text>
<text font-size="18" fill="#1e1e1e" text-anchor="start" dominant-baseline="middle"><tspan x="1140.0" y="22.8">Cloud</tspan></text>
<text font-size="18" fill="#1971c2" text-anchor="start" dominant-baseline="middle"><tspan x="280.0" y="58.8">sail</tspan></text>
