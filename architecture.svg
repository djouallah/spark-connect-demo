<text font-size="16" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle"><tspan x="845.0" y="110.0">Sail 0.7.2 server</tspan><tspan x="845.0" y="130.0">started in-process (pysail)</tspan><tspan x="845.0" y="150.0">Rust + DataFusion, no JVM</tspan></text>
