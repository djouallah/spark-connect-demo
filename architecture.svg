<text font-size="16" fill="#495057" text-anchor="start" dominant-baseline="middle"><tspan x="0.0" y="799.6">Sail and Snowflake: real Spark Connect (gRPC), but the server runs on the laptop.</tspan><tspan x="0.0" y="819.6">Fabric: no Spark Connect endpoint; Livy runs the cell code on a remote Spark driver,</tspan><tspan x="0.0" y="839.6">so laptop paths aren't visible there. The Summary and close cells (# laptop) stay local.</tspan></text>
